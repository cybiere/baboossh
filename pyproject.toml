[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "baboossh"
dynamic = ["version"]
description = "SSH spreading made easy for red teams in a hurry"
readme = "README.rst"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [
    { name = "Cybiere - Akerva", email = "cybiere@tutanota.com" },
]
keywords = ["ssh", "spread", "redteam", "pentest"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Natural Language :: English",
    "Operating System :: POSIX",
    "Topic :: Security",
]
dependencies = [
    "cmd2>=2.5",
    "tabulate",
    "paramiko>=3.0",
    "python-libnmap",
]

[project.urls]
"Homepage" = "https://github.com/cybiere/BabooSSH"
"Bug Tracker" = "https://github.com/cybiere/BabooSSH/issues"
"Documentation" = "https://baboossh.cybiere.fr/"
"Source Code" = "https://github.com/cybiere/BabooSSH"

[project.scripts]
baboossh = "baboossh.shell:main"

[tool.setuptools.dynamic]
version = { attr = "baboossh.version.BABOOSSH_VERSION" }

[tool.setuptools.packages.find]
include = ["baboossh*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.txt", "*.rst"]

[dependency-groups]
docs = ["sphinx", "sphinx_rtd_theme"]
dev = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: requires Docker and the tests/docker/ compose range; opt-in via --run-docker",
]
